[project]
name = "policy-rag"
version = "0.7.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "pypdf>=7.0",
    "python-multipart>=0.0.30",
    "httpx>=0.28",
    "jieba>=0.42",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: 需要本机 PostgreSQL 的接口集成测试，使用 pytest -m integration 运行",
]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
"app/core/security.py" = ["B008"]